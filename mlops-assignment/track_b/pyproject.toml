[project]
name = "ai-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "cachetools>=7.2.1",
    "chromadb>=1.5.9",
    "evidently[llm]>=0.7.23",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "mlflow>=3.17.0",
    "numpy>=2.5.3",
    "openai>=2.54.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "tabulate>=0.10.0",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
